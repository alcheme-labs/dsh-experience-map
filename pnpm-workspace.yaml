packages:
  - .

# Runtime peers come from the target dsh Profile. Source compilation uses the
# explicit registry development dependencies declared in package.json.
autoInstallPeers: false
strictPeerDependencies: false

allowBuilds:
  esbuild: true
  # Transformers.js needs the official ONNX Runtime native loader for local
  # text embeddings. The benchmark does not use protobufjs or sharp build
  # scripts, so keep those transitive scripts disabled.
  onnxruntime-node: true
  protobufjs: false
  sharp: false

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-brand@0.1.2-alpha.2'
  - '@deepseek-ai/dsh-client-connection@0.1.2-alpha.2'
  - '@deepseek-ai/dsh-client-locale@0.1.2-alpha.2'
